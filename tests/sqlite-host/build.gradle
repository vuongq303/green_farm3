plugins { id 'java' }
repositories { google(); mavenCentral() }
// A JVM storage test harness, not an APK variant or replacement game runtime.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.robolectric:android-all:9-robolectric-4913185-2'
    testImplementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21'
    testImplementation files(providers.gradleProperty('storageClasses').getOrElse('../../app/build/tmp/kotlin-classes/debug'))
}
configurations { androidAars }
dependencies {
    androidAars 'androidx.test:monitor:1.8.0@aar'
    androidAars 'androidx.test.espresso:espresso-idling-resource:3.7.0@aar'
}
tasks.register('extractAndroidPeers') {
    inputs.files(configurations.androidAars)
    outputs.dir(layout.buildDirectory.dir('android-peers'))
    doLast {
        configurations.androidAars.files.each { aar ->
            def target = layout.buildDirectory.file("android-peers/${aar.name}/classes.jar").get().asFile
            if (target.exists()) target.setWritable(true)
            copy {
                filePermissions { unix('0644') }
                from zipTree(aar)
                include 'classes.jar'
                into layout.buildDirectory.dir("android-peers/${aar.name}")
            }
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }
test {
    doFirst { layout.buildDirectory.dir('test-home').get().asFile.mkdirs() }
    dependsOn 'extractAndroidPeers'
    classpath += files(provider { fileTree(layout.buildDirectory.dir('android-peers')).matching { include '**/*.jar' }.files })
    if (providers.environmentVariable('GREENFARM_TEST_JAVA').isPresent()) {
        executable = providers.environmentVariable('GREENFARM_TEST_JAVA').get()
    } else {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    }
    maxHeapSize = '2g'
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    // Keep the platform proxy and CA verification, including Robolectric's own resolver.
    def proxyUrl = System.getenv('HTTPS_PROXY') ?: System.getenv('https_proxy')
    if (proxyUrl) {
        def proxy = new URI(proxyUrl)
        systemProperty 'https.proxyHost', proxy.host
        systemProperty 'https.proxyPort', proxy.port.toString()
    }
    if (System.getProperty('javax.net.ssl.trustStore')) {
        systemProperty 'javax.net.ssl.trustStore', System.getProperty('javax.net.ssl.trustStore')
    }
    systemProperty 'user.home', layout.buildDirectory.dir('test-home').get().asFile.path
    testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat 'full'; showStandardStreams = true }
}
