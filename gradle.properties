# Backend HTTP(S) origin: hostname, IPv4 or bracketed IPv6, with an optional port.
# This value is embedded at build time; rebuild and reinstall after changing it.
BACKEND_BASE_URL= https://lakes-klein-chubby-oxygen.trycloudflare.com

# Public HTTPS origin of the Facebook / embedded account authentication backend.
# Configure the same origin as AUTH_PUBLIC_BASE_URL in backend/.env.
# Empty builds the account screen but never grants an unverified session.
AUTH_BASE_URL= https://lakes-klein-chubby-oxygen.trycloudflare.com
